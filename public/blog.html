<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Blog</h1>
  <div class="user-info">
    <span id="username-display"></span>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="/dashboard.html">My Blogs</a> › <span id="blog-name-crumb"></span></div>

  <div class="page-title">
    <h2 id="blog-title"></h2>
    <div style="display:flex; gap:0.5rem; align-items:center">
      <a id="view-blog-link" href="#" class="btn btn-secondary btn-sm">View Blog</a>
      <a id="calendar-link" href="#" class="btn btn-secondary btn-sm">Calendar</a>
      <button class="btn btn-secondary btn-sm" onclick="openEditBlogModal()">Edit Info</button>
      <button class="btn btn-danger btn-sm" onclick="deleteBlog()">Delete Blog</button>
      <button class="btn btn-primary" onclick="openModal()">+ New Post</button>
    </div>
  </div>

  <p id="blog-purpose" style="color:#666; margin-bottom:1.25rem"></p>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem">
    <p id="blog-total-size" style="color:#888; font-size:0.85rem; margin:0"></p>
    <div style="display:flex; gap:0.5rem; align-items:center">
      <label for="sort-field" style="font-size:0.85rem; color:#666; margin:0">Sort by:</label>
      <select id="sort-field" onchange="renderPosts()">
        <option value="date">Date</option>
        <option value="size">Size</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="sort-dir-btn" onclick="toggleSortDir()" title="Toggle ascending/descending">&#8595;</button>
    </div>
  </div>

  <div id="posts-list"></div>
</div>

<!-- Edit Blog Info Modal -->
<div class="modal-overlay" id="edit-blog-modal">
  <div class="modal">
    <h3>Edit Blog Info</h3>
    <div id="edit-blog-modal-msg"></div>
    <form id="edit-blog-form">
      <label>Name</label>
      <input type="text" id="edit-blog-name" required>
      <label>Purpose / Description</label>
      <textarea id="edit-blog-purpose"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeEditBlogModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- New Post Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Create a Post</h3>
    <div id="modal-msg"></div>
    <form id="post-form">
      <label>Title</label>
      <input type="text" id="post-title" required placeholder="Post title">
      <label>Hike Date</label>
      <input type="date" id="post-hikedate">
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<script src="account-menu.js"></script>
<script>
const params = new URLSearchParams(location.search);
const blogId = params.get('id');
if (!blogId) window.location.href = '/dashboard.html';

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / 1024).toFixed(0) + ' KB';
}

let currentUsername = null;
let allPosts = [];
let sortField = 'date';
let sortDir = 'desc';
let currentBlog = null;

async function init() {
  const me = await fetch('/auth/me');
  if (!me.ok) { window.location.href = '/'; return; }
  const { username } = await me.json();
  currentUsername = username;
  initAccountMenu(username);
  loadBlog();
}

async function loadBlog() {
  const res = await fetch('/api/blogs');
  const blogs = await res.json();
  const blog = blogs.find(b => b.id === blogId);
  if (!blog) { window.location.href = '/dashboard.html'; return; }
  currentBlog = blog;
  document.title = blog.name;
  document.getElementById('blog-title').textContent = blog.name;
  document.getElementById('blog-name-crumb').textContent = blog.name;
  document.getElementById('blog-purpose').textContent = blog.purpose || '';
  document.getElementById('view-blog-link').href =
    `/view-calendar.html?user=${encodeURIComponent(currentUsername)}&blog=${encodeURIComponent(blogId)}`;
  document.getElementById('calendar-link').href = `/calendar.html?blog=${encodeURIComponent(blogId)}`;
  loadPosts();
}

async function loadPosts() {
  const res = await fetch(`/api/blogs/${blogId}/posts`);
  allPosts = await res.json();

  const totalSize = allPosts.reduce((sum, p) => sum + (p.size || 0), 0);
  document.getElementById('blog-total-size').textContent =
    allPosts.length ? `Total size: ${formatSize(totalSize)} across ${allPosts.length} post${allPosts.length === 1 ? '' : 's'}` : '';

  renderPosts();
}

function toggleSortDir() {
  sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  document.getElementById('sort-dir-btn').innerHTML = sortDir === 'desc' ? '&#8595;' : '&#8593;';
  renderPosts();
}

function renderPosts() {
  sortField = document.getElementById('sort-field').value;
  const el = document.getElementById('posts-list');

  if (!allPosts.length) {
    el.innerHTML = '<p style="color:#888">No posts yet. Create the first one!</p>';
    return;
  }

  const sorted = [...allPosts].sort((a, b) => {
    const av = sortField === 'size' ? (a.size || 0) : new Date(a.hikeDate || a.createdAt);
    const bv = sortField === 'size' ? (b.size || 0) : new Date(b.hikeDate || b.createdAt);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  el.innerHTML = sorted.map(p => `
    <div class="card">
      <h2>${esc(p.title)}</h2>
      <p>${new Date(p.hikeDate || p.createdAt).toLocaleDateString()} &middot; ${formatSize(p.size || 0)} &middot; ${p.photoCount || 0} photo${p.photoCount === 1 ? '' : 's'}</p>
      <div style="display:flex; gap:0.5rem; margin-top:0.5rem">
        <a href="/post.html?blog=${esc(blogId)}&post=${esc(p.id)}" class="btn btn-secondary btn-sm">Edit</a>
        <a href="/view-post.html?user=${esc(currentUsername)}&blog=${esc(blogId)}&post=${esc(p.id)}" class="btn btn-secondary btn-sm">View</a>
        <button class="btn btn-danger btn-sm" onclick="deletePost('${esc(p.id)}', '${esc(p.title)}')">Delete</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('post-form').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch(`/api/blogs/${blogId}/posts`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: document.getElementById('post-title').value, hikeDate: document.getElementById('post-hikedate').value || undefined })
  });
  const data = await res.json();
  if (res.ok) {
    closeModal();
    window.location.href = `/post.html?blog=${blogId}&post=${data.id}`;
  } else {
    document.getElementById('modal-msg').innerHTML = `<div class="error-msg">${data.error}</div>`;
  }
});

async function deletePost(id, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  const res = await fetch(`/api/blogs/${blogId}/posts/${id}`, { method: 'DELETE' });
  if (res.ok) loadPosts();
}

async function deleteBlog() {
  const name = document.getElementById('blog-title').textContent;
  if (!confirm(`Delete the blog "${name}" and all its posts? This cannot be undone.`)) return;
  const res = await fetch(`/api/blogs/${blogId}`, { method: 'DELETE' });
  if (res.ok) window.location.href = '/dashboard.html';
}

function openEditBlogModal() {
  document.getElementById('edit-blog-name').value = currentBlog.name;
  document.getElementById('edit-blog-purpose').value = currentBlog.purpose || '';
  document.getElementById('edit-blog-modal').classList.add('open');
  document.getElementById('edit-blog-name').focus();
}

function closeEditBlogModal() {
  document.getElementById('edit-blog-modal').classList.remove('open');
  document.getElementById('edit-blog-modal-msg').innerHTML = '';
}

document.getElementById('edit-blog-form').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch(`/api/blogs/${blogId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('edit-blog-name').value,
      purpose: document.getElementById('edit-blog-purpose').value
    })
  });
  const data = await res.json();
  if (res.ok) {
    closeEditBlogModal();
    loadBlog();
  } else {
    document.getElementById('edit-blog-modal-msg').innerHTML = `<div class="error-msg">${data.error}</div>`;
  }
});

function openModal() {
  const today = new Date().toISOString().slice(0, 10);
  const input = document.getElementById('post-title');
  input.value = today + ' ';
  document.getElementById('post-hikedate').value = today;
  document.getElementById('modal').classList.add('open');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('post-form').reset(); document.getElementById('modal-msg').innerHTML = ''; }

async function logout() { await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/'; }

init();
</script>
</body>
</html>
