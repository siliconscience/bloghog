<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Blog</h1>
  <div class="user-info">
    <span id="username-display"></span>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="container">
  <div class="breadcrumb">
    <a href="/dashboard.html">My Blogs</a> ›
    <a href="#" id="blog-link">Blog</a> ›
    <span id="post-title-crumb"></span>
  </div>

  <div class="page-title">
    <input type="text" id="post-title-input" class="title-input" onchange="saveTitle()" onkeydown="if(event.key==='Enter') this.blur()">
    <div style="display:flex; gap:0.5rem">
      <a id="view-post-link" href="#" class="btn btn-secondary btn-sm">View Post</a>
      <button class="btn btn-danger btn-sm" onclick="deletePost()">Delete Post</button>
    </div>
  </div>

  <div class="hike-date-row">
    <label for="hike-date-input">Hike Date:</label>
    <input type="date" id="hike-date-input">
    <button class="btn btn-secondary btn-sm" onclick="saveHikeDate()">Save</button>
  </div>

  <div id="post-content" class="post-content"></div>

  <div class="add-block-area">
    <h4>Add to post</h4>
    <div class="block-buttons">
      <button class="btn btn-secondary" onclick="openTextModal()">+ Text Block</button>
      <button class="btn btn-secondary" onclick="openImagePicker()">+ Image</button>
      <button class="btn btn-secondary" onclick="openTableModal()">+ Table</button>
      <button class="btn btn-secondary" onclick="openGalleryPicker()">+ Gallery</button>
    </div>
  </div>
</div>

<!-- Text block modal -->
<div class="modal-overlay" id="text-modal">
  <div class="modal">
    <h3>Add Text Block</h3>
    <div id="text-modal-msg"></div>
    <form id="text-form">
      <label>Text</label>
      <textarea id="text-input" required placeholder="Write something..."></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeTextModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>

<!-- Table creation modal -->
<div class="modal-overlay" id="table-modal">
  <div class="modal">
    <h3>Create Table</h3>
    <label style="margin-bottom:0.5rem; display:block">Number of columns</label>
    <div style="display:flex; gap:1rem; margin-bottom:1rem">
      <label style="font-weight:normal"><input type="radio" name="cols" value="1"> 1</label>
      <label style="font-weight:normal"><input type="radio" name="cols" value="2"> 2</label>
      <label style="font-weight:normal"><input type="radio" name="cols" value="3" checked> 3</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeTableModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createTable()">Create</button>
    </div>
  </div>
</div>

<!-- Cell editor modal -->
<div class="modal-overlay" id="cell-modal">
  <div class="modal modal-large">
    <h3 id="cell-modal-title">Cell</h3>
    <div id="cell-modal-body"></div>
    <div class="modal-actions" id="cell-modal-actions"></div>
  </div>
</div>

<!-- Large upload / compression modal -->
<div class="modal-overlay" id="reduce-modal">
  <div class="modal">
    <h3>Large Upload</h3>
    <p id="reduce-modal-msg"></p>
    <div id="reduce-checkbox-row" style="display:none; margin:0.75rem 0">
      <label style="display:flex; align-items:center; gap:0.5rem; font-weight:normal">
        <input type="checkbox" id="reduce-confirm-checkbox">
        <span id="reduce-checkbox-label"></span>
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="reduce-skip-btn">Upload without compressing</button>
      <button type="button" class="btn btn-primary" id="reduce-compress-btn">Compress &amp; Upload</button>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="image-input" accept="image/*" style="display:none">
<input type="file" id="replace-image-input" accept="image/*" style="display:none">
<input type="file" id="cell-image-input" accept="image/*" style="display:none">
<input type="file" id="gallery-input" accept="image/*" multiple style="display:none">

<script src="account-menu.js"></script>
<script>
const params = new URLSearchParams(location.search);
const blogId = params.get('blog');
const postId = params.get('post');
const doiParam = params.get('doi');
let calendarUrl = `/calendar.html?blog=${blogId}` + (doiParam ? `&doi=${encodeURIComponent(doiParam)}` : '');
if (!blogId || !postId) window.location.href = '/dashboard.html';

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function linkify(text) {
  const urlRe = /https?:\/\/[^\s<>"{}|\\^`[\]]+/g;
  const parts = [];
  let last = 0, m;
  while ((m = urlRe.exec(text)) !== null) {
    if (m.index > last) parts.push(esc(text.slice(last, m.index)));
    const url = m[0].replace(/[.,;:!?'")\]]+$/, '');
    parts.push(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`);
    last = m.index + url.length;
  }
  if (last < text.length) parts.push(esc(text.slice(last)));
  return parts.join('');
}

// --- Client-side image size reduction (offered when an upload looks large) ---
const REDUCE_AVG_THRESHOLD = 1 * 1024 * 1024;    // 1 MB average per image
const REDUCE_TOTAL_THRESHOLD = 10 * 1024 * 1024; // 10 MB total
const REDUCE_MAX_DIM = 1600; // ~2x the blog's 800px display width, so no visible quality loss on the page
const REDUCE_QUALITY = 0.85;

async function resizeImageFile(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, REDUCE_MAX_DIM / Math.max(bitmap.width, bitmap.height));
  if (scale >= 1) return file; // already small enough
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', REDUCE_QUALITY));
  return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
}

function showReduceDialog(total, avg) {
  const mb = n => (n / (1024 * 1024)).toFixed(1);
  return new Promise(resolve => {
    const modal = document.getElementById('reduce-modal');
    const msg = document.getElementById('reduce-modal-msg');
    const checkboxRow = document.getElementById('reduce-checkbox-row');
    const checkboxLabel = document.getElementById('reduce-checkbox-label');
    const checkbox = document.getElementById('reduce-confirm-checkbox');
    const skipBtn = document.getElementById('reduce-skip-btn');
    const compressBtn = document.getElementById('reduce-compress-btn');

    msg.textContent = `These image(s) total ${mb(total)} MB (avg ${mb(avg)} MB each). ` +
      `Compressing resizes to the blog's display size and recompresses — much smaller files, no visible quality loss on the page.`;

    const requireCheckbox = total > REDUCE_TOTAL_THRESHOLD;
    checkbox.checked = false;
    checkboxRow.style.display = requireCheckbox ? 'block' : 'none';
    checkboxLabel.textContent = `Yes, I really want to add ${mb(total)} MB`;

    function cleanup() {
      modal.classList.remove('open');
      skipBtn.onclick = null;
      compressBtn.onclick = null;
    }

    compressBtn.onclick = () => { cleanup(); resolve(true); };
    skipBtn.onclick = () => {
      if (requireCheckbox && !checkbox.checked) {
        alert('Check the box first to confirm you want to upload without compressing.');
        return;
      }
      cleanup();
      resolve(false);
    };

    modal.classList.add('open');
  });
}

async function maybeReduceImages(fileList) {
  const files = Array.from(fileList);
  const total = files.reduce((s, f) => s + f.size, 0);
  const avg = total / files.length;
  if (avg <= REDUCE_AVG_THRESHOLD && total <= REDUCE_TOTAL_THRESHOLD) return files;

  const shouldReduce = await showReduceDialog(total, avg);
  if (!shouldReduce) return files;
  return Promise.all(files.map(resizeImageFile));
}

let currentUsername = null;
let postContent = [];
let currentTitle = '';
let editingBlockId = null;
let selectedImageId = null;
let replacingBlockId = null;
let activeGutterIdx = null;
let pendingInsertAt = null;

async function init() {
  const me = await fetch('/auth/me');
  if (!me.ok) { window.location.href = '/'; return; }
  const { username } = await me.json();
  currentUsername = username;
  initAccountMenu(username);
  document.getElementById('view-post-link').href =
    `/view-post.html?user=${encodeURIComponent(username)}&blog=${encodeURIComponent(blogId)}&post=${encodeURIComponent(postId)}` +
    (doiParam ? `&doi=${encodeURIComponent(doiParam)}` : '');

  fetch('/api/blogs').then(r => r.json()).then(blogs => {
    const blog = blogs.find(b => b.id === blogId);
    if (blog) document.getElementById('blog-link').textContent = blog.name;
  });

  loadPost();
}

async function loadPost() {
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}`);
  if (!res.ok) { window.location.href = `/blog.html?id=${blogId}`; return; }
  const post = await res.json();
  document.title = post.title;
  currentTitle = post.title;
  document.getElementById('post-title-input').value = post.title;
  document.getElementById('post-title-crumb').textContent = post.title;

  // Point "Blog" breadcrumb at the calendar on this post's own date, so it works
  // even when arriving from a list view that doesn't carry a doi param.
  const postDoi = (post.hikeDate || post.createdAt).slice(0, 10);
  calendarUrl = `/calendar.html?blog=${blogId}&doi=${encodeURIComponent(postDoi)}`;
  document.getElementById('blog-link').href = calendarUrl;
  document.getElementById('view-post-link').href =
    `/view-post.html?user=${encodeURIComponent(currentUsername)}&blog=${encodeURIComponent(blogId)}&post=${encodeURIComponent(postId)}&doi=${encodeURIComponent(postDoi)}`;
  document.getElementById('hike-date-input').value = post.hikeDate || '';
  editingBlockId = null;
  selectedImageId = null;
  renderContent(post.content);
}

function renderContent(blocks) {
  postContent = blocks;
  const el = document.getElementById('post-content');
  if (!blocks.length) {
    el.innerHTML = renderGutter(0) + '<p style="color:#aaa; font-style:italic; padding:0.25rem 0">No content yet — add a block below or click + above.</p>';
    return;
  }
  let html = '';
  blocks.forEach((b, i) => { html += renderGutter(i) + renderBlock(b); });
  html += renderGutter(blocks.length);
  el.innerHTML = html;
  if (editingBlockId) {
    const ta = document.getElementById(`edit-ta-${editingBlockId}`);
    if (ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
}

function renderGutter(idx) {
  if (activeGutterIdx === idx) {
    return `<div class="gutter gutter-open" onclick="event.stopPropagation()">
      <button class="btn btn-secondary btn-sm" onclick="insertTextAt(${idx})">Text</button>
      <button class="btn btn-secondary btn-sm" onclick="insertImageAt(${idx})">Image</button>
      <button class="btn btn-secondary btn-sm" onclick="insertTableAt(${idx})">Table</button>
      <button class="btn btn-secondary btn-sm" onclick="insertGalleryAt(${idx})">Gallery</button>
      <button class="btn btn-secondary btn-sm" style="color:#999" onclick="closeGutter()">✕</button>
    </div>`;
  }
  return `<div class="gutter" onclick="activateGutter(${idx}, event)"></div>`;
}

function activateGutter(idx, e) {
  e.stopPropagation();
  activeGutterIdx = idx;
  renderContent(postContent);
}

function closeGutter() {
  activeGutterIdx = null;
  renderContent(postContent);
}

document.addEventListener('click', () => {
  if (activeGutterIdx !== null) { activeGutterIdx = null; renderContent(postContent); }
});

function insertTextAt(idx) {
  activeGutterIdx = null; pendingInsertAt = idx;
  renderContent(postContent);
  document.getElementById('text-modal').classList.add('open');
  document.getElementById('text-input').focus();
}
function insertImageAt(idx) {
  activeGutterIdx = null; pendingInsertAt = idx;
  renderContent(postContent);
  document.getElementById('image-input').click();
}
function insertTableAt(idx) {
  activeGutterIdx = null; pendingInsertAt = idx;
  renderContent(postContent);
  document.getElementById('table-modal').classList.add('open');
}
function insertGalleryAt(idx) {
  activeGutterIdx = null; pendingInsertAt = idx;
  renderContent(postContent);
  document.getElementById('gallery-input').click();
}

function renderBlock(b) {
  if (b.type === 'text') {
    if (editingBlockId === b.id) {
      const lines = (b.text.match(/\n/g) || []).length + 1;
      const rows = Math.max(5, Math.ceil(lines / 2));
      return `
        <div class="block block-editing">
          <textarea class="block-edit-textarea" id="edit-ta-${esc(b.id)}" rows="${rows}"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(b.text)}</textarea>
          <div class="block-edit-actions">
            <button class="btn btn-primary btn-sm" onclick="saveTextBlock('${esc(b.id)}')">Save</button>
            <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>`;
    }
    return `
      <div class="block block-editable" onclick="startEditText('${esc(b.id)}')">
        <div class="block-label">Text &nbsp;<span class="edit-hint">click to edit</span></div>
        <p>${linkify(b.text)}</p>
      </div>`;
  }
  if (b.type === 'image') {
    const sel = selectedImageId === b.id;
    return `
      <div class="block block-editable ${sel ? 'block-selected' : ''}" onclick="toggleImageSelect('${esc(b.id)}')">
        <div class="block-label">Image${sel ? '' : ' &nbsp;<span class="edit-hint">click to manage</span>'}</div>
        <img src="${esc(b.url)}" alt="">
        ${sel ? `
        <div class="caption-edit-area" onclick="event.stopPropagation()">
          <textarea id="cap-${esc(b.id)}" placeholder="Add a caption…">${esc(b.caption || '')}</textarea>
          <button class="btn btn-secondary btn-sm" onclick="saveCaption('${esc(b.id)}')">Save caption</button>
        </div>
        <div class="block-image-actions" onclick="event.stopPropagation()">
          <button class="btn btn-secondary btn-sm" onclick="startReplaceImage('${esc(b.id)}')">Replace</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBlock('${esc(b.id)}')">Delete</button>
          <button class="btn btn-secondary btn-sm" onclick="deselectImage()">Cancel</button>
        </div>` : (b.caption ? `<p class="image-caption">${esc(b.caption)}</p>` : '')}
      </div>`;
  }
  if (b.type === 'table') {
    const rows = b.rows.map((row, ri) => `
      <tr>
        ${row.map((cell, ci) => renderTableCell(b.id, ri, ci, cell, ri * b.cols + ci)).join('')}
        <td class="table-row-del">
          <button class="btn btn-danger btn-sm" title="Delete row"
            onclick="event.stopPropagation(); deleteTableRow('${esc(b.id)}', ${ri})">×</button>
        </td>
      </tr>`).join('');
    return `
      <div class="block">
        <div class="block-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>Table (${b.cols} col${b.cols > 1 ? 's' : ''})</span>
          <button class="btn btn-danger btn-sm" onclick="deleteBlock('${esc(b.id)}')">Delete Table</button>
        </div>
        <table class="content-table"><tbody>${rows}</tbody></table>
        <button class="btn btn-secondary btn-sm" style="margin-top:0.5rem"
          onclick="addTableRow('${esc(b.id)}')">+ Add Row</button>
      </div>`;
  }
  return '';
}

// --- Table cell renderer (editor view) ---
function renderTableCell(blockId, row, col, cell, flatIdx) {
  const id = esc(blockId);
  const onclick = `openCellModal('${id}', ${row}, ${col})`;
  const drag = `data-block-id="${id}" data-flat-idx="${flatIdx}" onpointerdown="cellPointerDown(event,'${id}',${flatIdx})"`;
  if (!cell) {
    return `<td class="table-cell table-cell-empty" onclick="${onclick}" ${drag}><span class="cell-add">+</span></td>`;
  }
  if (cell.type === 'text') {
    return `<td class="table-cell table-cell-filled" onclick="${onclick}" ${drag}><p>${linkify(cell.text)}</p></td>`;
  }
  if (cell.type === 'image') {
    return `<td class="table-cell table-cell-filled" onclick="${onclick}" ${drag}>
      <img src="${esc(cell.url)}" alt="" class="cell-img" draggable="false">
      ${cell.caption ? `<p class="image-caption cell-caption">${esc(cell.caption)}</p>` : ''}
    </td>`;
  }
  return `<td class="table-cell" ${drag}></td>`;
}

// --- Drag-and-drop cell reorder (Pointer Events: same code path for mouse and touch) ---
const CELL_DRAG_THRESHOLD = 8; // px of movement before a press counts as a drag rather than a tap
let cellDragState = null; // { blockId, flatIdx, startX, startY, moved, srcEl, overEl }
let suppressNextCellClick = false;

function cellPointerDown(e, blockId, flatIdx) {
  if (e.button !== undefined && e.button !== 0) return; // left button / primary touch only
  cellDragState = { blockId, flatIdx, startX: e.clientX, startY: e.clientY, moved: false, srcEl: e.currentTarget, overEl: null };
  document.addEventListener('pointermove', cellPointerMove);
  document.addEventListener('pointerup', cellPointerUp);
  document.addEventListener('pointercancel', cellPointerCancel);
}

function cellPointerMove(e) {
  if (!cellDragState) return;
  const dx = e.clientX - cellDragState.startX;
  const dy = e.clientY - cellDragState.startY;

  if (!cellDragState.moved) {
    if (Math.hypot(dx, dy) < CELL_DRAG_THRESHOLD) return;
    cellDragState.moved = true;
    suppressNextCellClick = true;
    cellDragState.srcEl.classList.add('dragging');
  }
  e.preventDefault();

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const cellEl = target ? target.closest('.table-cell') : null;
  const isValidTarget = cellEl && cellEl.dataset.blockId === cellDragState.blockId && cellEl !== cellDragState.srcEl;

  if (cellDragState.overEl && cellDragState.overEl !== cellEl) {
    cellDragState.overEl.classList.remove('drag-over');
    cellDragState.overEl = null;
  }
  if (isValidTarget) {
    cellEl.classList.add('drag-over');
    cellDragState.overEl = cellEl;
  }
}

function cellPointerUp() {
  if (!cellDragState) return;
  const { blockId, flatIdx, moved, overEl } = cellDragState;
  cellCleanupDrag();

  if (moved && overEl) {
    const toIdx = parseInt(overEl.dataset.flatIdx);
    fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/order`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: flatIdx, to: toIdx })
    }).then(r => { if (r.ok) loadPost(); });
  }
}

function cellPointerCancel() {
  cellCleanupDrag();
}

function cellCleanupDrag() {
  if (cellDragState) {
    cellDragState.srcEl.classList.remove('dragging');
    if (cellDragState.overEl) cellDragState.overEl.classList.remove('drag-over');
  }
  cellDragState = null;
  document.removeEventListener('pointermove', cellPointerMove);
  document.removeEventListener('pointerup', cellPointerUp);
  document.removeEventListener('pointercancel', cellPointerCancel);
}

// --- Table row management ---
async function addTableRow(blockId) {
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/rows`, { method: 'POST' });
  if (res.ok) loadPost();
}

async function deleteTableRow(blockId, row) {
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/rows/${row}`, { method: 'DELETE' });
  if (res.ok) loadPost();
}

// --- Cell editor ---
let cellCtx = null; // { blockId, row, col }

function openCellModal(blockId, row, col) {
  if (suppressNextCellClick) { suppressNextCellClick = false; return; }
  editingBlockId = null;
  selectedImageId = null;
  cellCtx = { blockId, row, col };

  const block = postContent.find(b => b.id === blockId);
  const cell = block ? block.rows[row][col] : null;

  const title = document.getElementById('cell-modal-title');
  const body = document.getElementById('cell-modal-body');
  const actions = document.getElementById('cell-modal-actions');

  if (!cell) {
    title.textContent = 'Add to Cell';
    body.innerHTML = `
      <div class="block-buttons" style="margin-bottom:0.75rem">
        <button class="btn btn-secondary" onclick="showCellTextInput()">Text</button>
        <button class="btn btn-secondary" onclick="pickCellImage()">Image</button>
      </div>
      <div id="cell-text-area" style="display:none">
        <textarea id="cell-text-input" placeholder="Enter text..."></textarea>
      </div>`;
    actions.innerHTML = `<button class="btn btn-secondary" onclick="closeCellModal()">Cancel</button>`;
  } else if (cell.type === 'text') {
    title.textContent = 'Edit Cell';
    body.innerHTML = `<textarea id="cell-text-input">${esc(cell.text)}</textarea>`;
    actions.innerHTML = `
      <button class="btn btn-danger btn-sm" style="margin-right:auto" onclick="clearCell()">Delete</button>
      <button class="btn btn-secondary" onclick="closeCellModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCellText()">Save</button>`;
  } else if (cell.type === 'image') {
    title.textContent = 'Edit Cell';
    body.innerHTML = `
      <div class="zoom-wrap" id="cell-zoom-wrap">
        <img src="${esc(cell.url)}" alt="" id="cell-zoom-img">
      </div>
      <div class="caption-edit-area">
        <textarea id="cell-caption-input" placeholder="Add a caption…">${esc(cell.caption || '')}</textarea>
        <button class="btn btn-secondary btn-sm" onclick="saveCellCaption()">Save caption</button>
      </div>`;
    actions.innerHTML = `
      <button class="btn btn-danger btn-sm" style="margin-right:auto" onclick="clearCell()">Delete</button>
      <button class="btn btn-secondary" onclick="closeCellModal()">Cancel</button>
      <button class="btn btn-secondary" onclick="pickCellImage()">Replace</button>`;
    initZoomPan(document.getElementById('cell-zoom-wrap'), document.getElementById('cell-zoom-img'));
  }

  document.getElementById('cell-modal').classList.add('open');
}

// Wheel-to-zoom (desktop) and pinch-to-zoom (touch) on an image, with drag-to-pan once zoomed in.
function initZoomPan(wrap, img) {
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0;
  let pinchStartDist = 0, pinchStartScale = 1;

  function apply() {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    img.classList.toggle('zoomed', scale > 1);
  }

  function clampScale(s) { return Math.min(4, Math.max(1, s)); }

  function setScale(newScale) {
    scale = clampScale(newScale);
    if (scale === 1) { tx = 0; ty = 0; }
    apply();
  }

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    setScale(scale * (1 - e.deltaY * 0.0015));
  }, { passive: false });

  function onMouseMove(e) {
    tx = dragStartTx + (e.clientX - dragStartX);
    ty = dragStartTy + (e.clientY - dragStartY);
    apply();
  }
  function onMouseUp() {
    dragging = false;
    img.classList.remove('grabbing');
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }
  wrap.addEventListener('mousedown', e => {
    if (scale === 1) return;
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartTx = tx; dragStartTy = ty;
    img.classList.add('grabbing');
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
  });

  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = touchDist(e.touches);
      pinchStartScale = scale;
      dragging = false;
    } else if (e.touches.length === 1 && scale > 1) {
      dragging = true;
      dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
      dragStartTx = tx; dragStartTy = ty;
    }
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      setScale(pinchStartScale * (touchDist(e.touches) / pinchStartDist));
    } else if (e.touches.length === 1 && dragging) {
      e.preventDefault();
      tx = dragStartTx + (e.touches[0].clientX - dragStartX);
      ty = dragStartTy + (e.touches[0].clientY - dragStartY);
      apply();
    }
  }, { passive: false });

  wrap.addEventListener('touchend', () => { dragging = false; });
}

function closeCellModal() {
  document.getElementById('cell-modal').classList.remove('open');
}

function showCellTextInput() {
  document.getElementById('cell-text-area').style.display = '';
  document.getElementById('cell-text-input').focus();
  document.getElementById('cell-modal-actions').innerHTML = `
    <button class="btn btn-secondary" onclick="closeCellModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveCellText()">Save</button>`;
}

async function saveCellText() {
  const text = document.getElementById('cell-text-input').value;
  if (!text.trim()) return;
  const { blockId, row, col } = cellCtx;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/cells/${row}/${col}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (res.ok) { closeCellModal(); cellCtx = null; loadPost(); }
}

async function saveCellCaption() {
  const caption = document.getElementById('cell-caption-input')?.value || '';
  const { blockId, row, col } = cellCtx;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/cells/${row}/${col}/caption`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption })
  });
  if (res.ok) { closeCellModal(); cellCtx = null; loadPost(); }
}

async function clearCell() {
  const { blockId, row, col } = cellCtx;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/cells/${row}/${col}`, {
    method: 'DELETE'
  });
  if (res.ok) { closeCellModal(); cellCtx = null; loadPost(); }
}

function pickCellImage() {
  closeCellModal(); // keeps cellCtx intact
  document.getElementById('cell-image-input').click();
}

document.getElementById('cell-image-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !cellCtx) return;
  const [reduced] = await maybeReduceImages([file]);
  const form = new FormData();
  form.append('image', reduced);
  const { blockId, row, col } = cellCtx;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${blockId}/cells/${row}/${col}/image`, {
    method: 'PUT', body: form
  });
  if (res.ok) { cellCtx = null; loadPost(); }
  else { const d = await res.json(); alert('Upload failed: ' + d.error); }
  e.target.value = '';
});

// --- Table creation ---
async function createTable() {
  const cols = document.querySelector('input[name="cols"]:checked')?.value;
  if (!cols) return;
  const pos = pendingInsertAt; pendingInsertAt = null;
  const body = { cols: parseInt(cols) };
  if (pos !== null) body.insertAt = pos;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/table`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.ok) { closeTableModal(); loadPost(); }
}

function openTableModal() { pendingInsertAt = null; document.getElementById('table-modal').classList.add('open'); }
function closeTableModal() { pendingInsertAt = null; document.getElementById('table-modal').classList.remove('open'); }

// --- Text block editing ---
function startEditText(id) {
  editingBlockId = id;
  selectedImageId = null;
  renderContent(postContent);
}

function cancelEdit() {
  editingBlockId = null;
  renderContent(postContent);
}

async function saveTextBlock(id) {
  const ta = document.getElementById(`edit-ta-${id}`);
  const text = ta ? ta.value : '';
  if (!text.trim()) return;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (res.ok) loadPost();
}

// --- Image block management ---
function toggleImageSelect(id) {
  if (editingBlockId) { cancelEdit(); return; }
  selectedImageId = selectedImageId === id ? null : id;
  renderContent(postContent);
}

function deselectImage() {
  selectedImageId = null;
  renderContent(postContent);
}

async function saveCaption(id) {
  const ta = document.getElementById(`cap-${id}`);
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${id}/caption`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption: ta ? ta.value : '' })
  });
  if (res.ok) loadPost();
}

function startReplaceImage(id) {
  replacingBlockId = id;
  document.getElementById('replace-image-input').click();
}

async function deleteBlock(id) {
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${id}`, { method: 'DELETE' });
  if (res.ok) loadPost();
}

document.getElementById('replace-image-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !replacingBlockId) return;
  const [reduced] = await maybeReduceImages([file]);
  const form = new FormData();
  form.append('image', reduced);
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/${replacingBlockId}/image`, { method: 'PUT', body: form });
  if (res.ok) loadPost();
  else { const d = await res.json(); alert('Upload failed: ' + d.error); }
  replacingBlockId = null;
  e.target.value = '';
});

// --- Add new blocks ---
document.getElementById('text-form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = document.getElementById('text-input').value;
  const pos = pendingInsertAt; pendingInsertAt = null;
  const body = { text };
  if (pos !== null) body.insertAt = pos;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/text`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.ok) { closeTextModal(); loadPost(); }
  else {
    const data = await res.json();
    document.getElementById('text-modal-msg').innerHTML = `<div class="error-msg">${data.error}</div>`;
  }
});

function openTextModal() { pendingInsertAt = null; document.getElementById('text-modal').classList.add('open'); document.getElementById('text-input').focus(); }
function closeTextModal() { pendingInsertAt = null; document.getElementById('text-modal').classList.remove('open'); document.getElementById('text-form').reset(); document.getElementById('text-modal-msg').innerHTML = ''; }

function openImagePicker() { pendingInsertAt = null; document.getElementById('image-input').click(); }

function openGalleryPicker() { pendingInsertAt = null; document.getElementById('gallery-input').click(); }

document.getElementById('gallery-input').addEventListener('change', async e => {
  const files = e.target.files;
  if (!files.length) return;
  const pos = pendingInsertAt; pendingInsertAt = null;
  const reducedFiles = await maybeReduceImages(files);
  const form = new FormData();
  for (const file of reducedFiles) form.append('images', file);
  if (pos !== null) form.append('insertAt', pos);
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/gallery`, { method: 'POST', body: form });
  if (res.ok) loadPost();
  else { const d = await res.json(); alert('Upload failed: ' + d.error); }
  e.target.value = '';
});

document.getElementById('image-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const pos = pendingInsertAt; pendingInsertAt = null;
  const [reduced] = await maybeReduceImages([file]);
  const form = new FormData();
  form.append('image', reduced);
  if (pos !== null) form.append('insertAt', pos);
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}/blocks/image`, { method: 'POST', body: form });
  if (res.ok) loadPost();
  else { const d = await res.json(); alert('Upload failed: ' + d.error); }
  e.target.value = '';
});

async function deletePost() {
  if (!confirm(`Delete "${currentTitle}"? This cannot be undone.`)) return;
  const res = await fetch(`/api/blogs/${blogId}/posts/${postId}`, { method: 'DELETE' });
  if (res.ok) window.location.href = calendarUrl;
}

async function saveTitle() {
  const input = document.getElementById('post-title-input');
  const title = input.value.trim();
  if (!title) { input.value = currentTitle; return; }
  if (title === currentTitle) return;
  await fetch(`/api/blogs/${blogId}/posts/${postId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title })
  });
  currentTitle = title;
  document.title = title;
  document.getElementById('post-title-crumb').textContent = title;
}

async function saveHikeDate() {
  const hikeDate = document.getElementById('hike-date-input').value;
  await fetch(`/api/blogs/${blogId}/posts/${postId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ hikeDate })
  });
}

async function logout() { await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/'; }

init();
